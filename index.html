<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loup-Garou en ligne</title>
<link href="https://fonts.googleapis.com/css2?family=Almendra:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c2536;--panel:#273550;--ink:#ece9f6;--mute:#9aa6c0;--moon:#f2c94c;--wolf:#c8463c;--ok:#4caf7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 64px}
h1,h2{font-family:Almendra,serif;margin:0 0 12px;color:var(--moon)}
h1{font-size:2.4rem;text-align:center;margin-top:24px}
.panel{background:var(--panel);border-radius:14px;padding:18px;margin-bottom:16px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:var(--moon);color:#1c2536;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--mute)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--mute);background:var(--bg);color:var(--ink);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row>*{flex:1 1 auto}
.hidden{display:none}
canvas{background:#fff;border-radius:50%;touch-action:none;width:160px;height:160px;border:4px solid var(--moon)}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid var(--ink)}
.room{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #3a4a68}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.p{text-align:center;font-size:.9rem}
.p img{width:72px;height:72px;border-radius:50%;border:3px solid var(--mute);object-fit:cover;background:#fff}
.p.gm img{border-color:var(--wolf)}
.err{color:#ff9b8f;min-height:1.4em}
.code{font-family:Almendra,serif;font-size:1.6rem;color:var(--moon)}
</style>
</head>
<body>
<main>
<h1>Loup-Garou</h1>
<p class="err" id="err" role="alert"></p>

<!-- Écran 1 : connexion -->
<section id="s-login" class="panel">
  <h2>Se connecter</h2>
  <div class="row">
    <button id="b-google">Continuer avec Google</button>
    <button id="b-anon" class="alt">Jouer sans compte</button>
  </div>
</section>

<!-- Écran 2 : profil -->
<section id="s-profile" class="panel hidden">
  <h2>Ton profil</h2>
  <label for="pseudo">Pseudo</label>
  <input id="pseudo" maxlength="16" placeholder="Ex. LoupSolitaire">
  <div class="row">
    <canvas id="cv" width="160" height="160" aria-label="Dessine ton avatar"></canvas>
    <div>
      <div class="colors" id="colors"></div>
      <div class="row"><button class="alt" id="b-clear">Effacer</button></div>
    </div>
  </div>
  <div class="row"><button id="b-save">Enregistrer</button></div>
</section>

<!-- Écran 3 : accueil -->
<section id="s-home" class="hidden">
  <div class="panel">
    <h2>Créer une partie</h2>
    <div class="row">
      <button id="b-create-pub">Room publique</button>
      <button id="b-create-priv" class="alt">Room privée</button>
    </div>
  </div>
  <div class="panel">
    <h2>Rejoindre avec un code</h2>
    <div class="row"><input id="code-in" placeholder="Ex. trytoact" maxlength="12"><button id="b-join">Rejoindre</button></div>
  </div>
  <div class="panel">
    <h2>Rooms publiques</h2>
    <div id="list"><p>Aucune room ouverte pour l’instant. Crée la première.</p></div>
  </div>
  <button class="alt" id="b-edit">Modifier mon profil</button>
</section>

<!-- Écran 4 : lobby -->
<section id="s-lobby" class="hidden">
  <div class="panel">
    <h2>Lobby</h2>
    <p>Code de la room : <span class="code" id="l-code"></span> <span id="l-vis"></span></p>
    <div class="row">
      <button id="b-role-p">Je joue</button>
      <button id="b-role-gm" class="alt">Je suis Maître du jeu</button>
    </div>
  </div>
  <div class="panel"><div class="players" id="l-players"></div><p id="l-count"></p></div>
  <div class="panel hidden" id="l-host">
    <h2>Réglages de l’host</h2>
    <p>Choix des rôles et des scénarios : prochaine étape.</p>
  </div>
  <div class="row"><button id="b-start" disabled>Lancer la partie</button><button class="alt" id="b-leave">Quitter</button></div>
</section>
</main>

<script type="module">
// 1) Colle ici la config de ton projet Firebase (Paramètres du projet > Tes applications > Web)
const firebaseConfig = {
  apiKey: "AIzaSyAag1uFiFKqJ2js0OHJIgpbSVsPqR2qFHE",
  authDomain: "leloupgaroudedoog.firebaseapp.com",
  projectId: "leloupgaroudedoog",
  storageBucket: "leloupgaroudedoog.firebasestorage.app",
  messagingSenderId: "282434115334",
  appId: "1:282434115334:web:741762d351339b33b63087"
};

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signInAnonymously}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,deleteDoc,collection,onSnapshot,query,where,serverTimestamp,updateDoc}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id);
const show=id=>["s-login","s-profile","s-home","s-lobby"].forEach(s=>$(s).classList.toggle("hidden",s!==id));
const fail=e=>{$("err").textContent=e.message||String(e)};
let me=null, profile=null, roomCode=null, unsubs=[];
const MAX_PLAYERS=12;

// ---------- Connexion ----------
$("b-google").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(fail);
$("b-anon").onclick=()=>signInAnonymously(auth).catch(fail);
onAuthStateChanged(auth,async u=>{
  me=u; if(!u) return show("s-login");
  try{
    const snap=await getDoc(doc(db,"users",u.uid));
    if(snap.exists()){profile=snap.data(); goHome();} else show("s-profile");
  }catch(e){console.error(e); fail(e); show("s-profile");}
});

// ---------- Avatar façon Gartic Phone ----------
const cv=$("cv"), ctx=cv.getContext("2d"); let color="#1c2536", drawing=false;
ctx.fillStyle="#fff"; ctx.fillRect(0,0,160,160); ctx.lineWidth=6; ctx.lineCap="round";
["#1c2536","#c8463c","#f2c94c","#4caf7a","#3b82c4","#8e5bd0","#ffffff"].forEach(c=>{
  const i=document.createElement("i"); i.style.background=c; i.onclick=()=>color=c; $("colors").append(i);
});
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*160/r.width,(e.clientY-r.top)*160/r.height]};
cv.onpointerdown=e=>{drawing=true;ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(...pos(e));cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(drawing){ctx.lineTo(...pos(e));ctx.stroke()}};
cv.onpointerup=()=>drawing=false;
$("b-clear").onclick=()=>{ctx.fillStyle="#fff";ctx.fillRect(0,0,160,160)};
$("b-save").onclick=async()=>{
  const name=$("pseudo").value.trim(); if(!name) return fail({message:"Choisis un pseudo."});
  profile={name,avatar:cv.toDataURL("image/jpeg",.6)};
  await setDoc(doc(db,"users",me.uid),profile).catch(fail); goHome();
};
$("b-edit").onclick=()=>{$("pseudo").value=profile.name;show("s-profile")};

// ---------- Accueil et liste des rooms publiques ----------
function goHome(){
  $("err").textContent=""; show("s-home");
  unsubs.forEach(u=>u()); unsubs=[];
  unsubs.push(onSnapshot(query(collection(db,"rooms"),where("public","==",true),where("status","==","lobby")),s=>{
    $("list").innerHTML=s.empty?"<p>Aucune room ouverte pour l’instant. Crée la première.</p>":"";
    s.forEach(d=>{const r=d.data(),el=document.createElement("div");el.className="room";
      el.innerHTML=`<span>${r.hostName} <small>(${r.count||0}/${MAX_PLAYERS})</small></span>`;
      const b=document.createElement("button");b.textContent="Rejoindre";b.onclick=()=>joinRoom(d.id);el.append(b);$("list").append(el)});
  },fail));
}
const genCode=()=>Array.from({length:6},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.random()*31|0]).join("");

async function createRoom(isPublic){
  const code=genCode();
  await setDoc(doc(db,"rooms",code),{hostUid:me.uid,hostName:profile.name,public:isPublic,status:"lobby",createdAt:serverTimestamp(),count:0}).catch(fail);
  joinRoom(code);
}
$("b-create-pub").onclick=()=>createRoom(true);
$("b-create-priv").onclick=()=>createRoom(false);
$("b-join").onclick=()=>joinRoom($("code-in").value.trim().toLowerCase());

// ---------- Lobby ----------
async function joinRoom(code){
  const room=await getDoc(doc(db,"rooms",code));
  if(!room.exists()) return fail({message:"Code inconnu."});
  roomCode=code; await setDoc(doc(db,"rooms",code,"players",me.uid),{name:profile.name,avatar:profile.avatar,role:"player",joinedAt:serverTimestamp()}).catch(fail);
  $("err").textContent=""; show("s-lobby");
  $("l-code").textContent=code; $("l-vis").textContent=room.data().public?"(publique)":"(privée)";
  $("l-host").classList.toggle("hidden",room.data().hostUid!==me.uid);
  unsubs.forEach(u=>u()); unsubs=[];
  unsubs.push(onSnapshot(collection(db,"rooms",code,"players"),s=>renderLobby(s.docs.map(d=>({id:d.id,...d.data()})))));
}
function renderLobby(list){
  const gm=list.filter(p=>p.role==="gm"), pl=list.filter(p=>p.role==="player");
  $("l-players").innerHTML=list.map(p=>`<div class="p ${p.role}"><img src="${p.avatar}" alt=""><div>${p.name.replace(/</g,"&lt;")}${p.role==="gm"?"<br>MJ":""}</div></div>`).join("");
  $("l-count").textContent=`${pl.length}/${MAX_PLAYERS} joueurs, ${gm.length}/1 maître du jeu`;
  $("b-start").disabled=!(gm.length===1&&pl.length>=1&&!$("l-host").classList.contains("hidden"));
  const mine=list.find(p=>p.id===me.uid);
  $("b-role-gm").disabled=gm.length>=1&&mine?.role!=="gm";
  $("b-role-p").disabled=pl.length>=MAX_PLAYERS&&mine?.role!=="player";
}
const setRole=r=>updateDoc(doc(db,"rooms",roomCode,"players",me.uid),{role:r}).catch(fail);
$("b-role-p").onclick=()=>setRole("player");
$("b-role-gm").onclick=()=>setRole("gm");
$("b-leave").onclick=async()=>{await deleteDoc(doc(db,"rooms",roomCode,"players",me.uid));roomCode=null;goHome()};
$("b-start").onclick=()=>fail({message:"Le moteur de partie arrive à l’étape 2."});
</script>
</body>
</html>
